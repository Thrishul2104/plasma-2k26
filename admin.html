<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>PLASMA 2K26 Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#0a0410;color:#f3e9f5;font-family:system-ui,sans-serif}
h1,h2{color:#e0b04a;margin:0 0 12px}.w{max-width:1000px;margin:0 auto}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #3a1d4a;background:#160a1f;color:#f3e9f5;font:inherit}
button{padding:9px 18px;border:0;border-radius:6px;background:linear-gradient(90deg,#ff3d8b,#9b5cff);color:#fff;font-weight:700;cursor:pointer}
button.s{background:none;border:1px solid #6b2a44;color:#b9a6c4;padding:5px 12px;font-size:13px}
.box{background:#160a1f;border:1px solid #2a1638;border-radius:12px;padding:18px;margin-bottom:18px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{background:none;border:1px solid #6b2a44;color:#b9a6c4}.tabs .on{background:#ff3d8b;color:#fff;border-color:#ff3d8b}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #2a1638;text-align:left;white-space:nowrap}th{color:#e0b04a}
#msg{color:#ff3d8b;min-height:22px;margin:8px 0}.hide{display:none}label{font-size:12px;color:#b9a6c4}
</style></head><body><div class="w">
<div id="login" class="box" style="max-width:380px;margin:60px auto"><h1>Admin Login</h1>
<div class="f" style="grid-template-columns:1fr"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"></div>
<button id="lb">Sign in</button></div>
<div id="app" class="hide">
<div class="top"><h1>PLASMA 2K26 Admin</h1><button class="s" id="lo">Log out</button></div>
<div class="tabs"><button id="t1" class="on">Events</button><button id="t2">Registrations</button></div>
<div id="msg"></div>
<div id="p1"><div class="box"><h2 id="ft">Add event</h2>
<div class="f"><div><label>Name</label><input id="name"></div><div><label>Track</label><select id="track"><option>Robotics</option><option>Code &amp; Compute</option><option>Research &amp; Presentation</option><option>Engineering &amp; Design</option><option>Enterprise &amp; Expression</option><option>General</option></select></div>
<div><label>Date</label><input id="event_date" type="date"></div>
<div><label>Venue</label><input id="venue"></div><div><label>Team size</label><input id="team_size" value="1-4"></div><div><label>Prize</label><input id="prize"></div>
<div><label>Fee (₹)</label><input id="fee" type="number" value="0"></div><div><label>Rulebook URL</label><input id="rulebook_url" placeholder="rulebooks/event-name.pdf"></div></div>
<label>Description</label><textarea id="description" rows="2"></textarea>
<p><label><input type="checkbox" id="reg_open" checked style="width:auto"> Registration open</label> &nbsp; <label><input type="checkbox" id="is_published" checked style="width:auto"> Published</label></p>
<button id="sv">Save event</button> <button class="s" id="cl">Clear</button></div>
<div class="box tw"><table><thead><tr><th>Event</th><th>Date</th><th>Time</th><th>Venue</th><th>Prize</th><th>Regs</th><th></th></tr></thead><tbody id="eb"></tbody></table></div></div>
<div id="p2" class="hide"><div class="top"><select id="fe" style="max-width:300px"></select><button id="ex">Export CSV</button></div>
<div class="box tw"><table><thead><tr><th>Event</th><th>Name</th><th>Email</th><th>Phone</th><th>College</th><th>Team</th><th>UTR/Ref</th><th>Time</th><th></th></tr></thead><tbody id="rb"></tbody></table></div></div>
</div></div>
<script>
var SB="https://ovuvtarrhfoyekbpppwh.supabase.co",KEY="sb_publishable_Z6dLzghS7u2xUjOy93BxwQ_R2QhWikq",tok=sessionStorage.getItem("tok"),EV=[],RG=[],eid=null;
var $=function(i){return document.getElementById(i)},F=["name","track","event_date","start_time","end_time","venue","team_size","prize","fee","rulebook_url","description"];
function say(t){$("msg").textContent=t||""}
function api(path,o){o=o||{};o.headers=Object.assign({apikey:KEY,Authorization:"Bearer "+(tok||KEY),"Content-Type":"application/json"},o.headers||{});return fetch(SB+path,o)}
function cell(tr,v){var td=document.createElement("td");td.textContent=v==null?"":v;tr.appendChild(td);return td}
function btn(td,t,f){var b=document.createElement("button");b.className="s";b.textContent=t;b.onclick=f;td.appendChild(b);td.appendChild(document.createTextNode(" "))}
$("lb").onclick=async function(){var r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value,password:$("pw").value})});
 var d=await r.json();if(!r.ok){alert("Login failed");return}tok=d.access_token;sessionStorage.setItem("tok",tok);start()};
$("lo").onclick=function(){sessionStorage.removeItem("tok");location.reload()};
async function start(){var r=await api("/rest/v1/admins?select=email");var a=r.ok?await r.json():[];
 if(!a.length){alert("This account is not an admin.");sessionStorage.removeItem("tok");tok=null;return}
 $("login").classList.add("hide");$("app").classList.remove("hide");await load()}
async function load(){
  /* Do not use select=* here. The events table no longer contains
     coordinator_name/coordinator_phone, and an explicit column list
     avoids stale-schema/cache problems in the Admin panel. */
  var eventSelect="id,name,track,description,event_date,start_time,end_time,venue,team_size,fee,prize,rulebook_url,reg_open,is_published";
  var a=await api("/rest/v1/events?select="+encodeURIComponent(eventSelect)+"&order=event_date.asc,start_time.asc"),
      b=await api("/rest/v1/registrations?select=*&order=created_at.desc");

  if(a.status===401||b.status===401){sessionStorage.removeItem("tok");location.reload();return}

  try{
    var aj=await a.json(), bj=await b.json();
    EV=Array.isArray(aj)?aj:[];
    RG=Array.isArray(bj)?bj:[];

    if(!a.ok){
      var em=aj&&aj.message?aj.message:(aj&&aj.details?aj.details:"Unknown events API error");
      say("Events load failed ("+a.status+"): "+em);
      return;
    }
    if(!b.ok){
      var rm=bj&&bj.message?bj.message:(bj&&bj.details?bj.details:"Unknown registrations API error");
      say("Registrations load failed ("+b.status+"): "+rm);
      return;
    }

    drawE();drawR();
  }catch(err){say("Could not display data: "+err.message)}
}
function drawE(){var tb=$("eb");tb.innerHTML="";EV.forEach(function(e){var tr=document.createElement("tr");
 cell(tr,e.name+(e.is_published?"":" (hidden)")+(e.reg_open?"":" (closed)"));cell(tr,e.event_date||"TBA");cell(tr,e.start_time?e.start_time.slice(0,5)+(e.end_time?"-"+e.end_time.slice(0,5):""):"TBA");cell(tr,e.venue);cell(tr,e.prize);
 cell(tr,RG.filter(function(g){return g.event_id===e.id}).length);var td=cell(tr,"");btn(td,"Edit",function(){edit(e)});btn(td,"Delete",function(){del(e)});tb.appendChild(tr)});
 var s=$("fe");s.innerHTML="";var o=document.createElement("option");o.value="";o.textContent="All events";s.appendChild(o);
 EV.forEach(function(e){var p=document.createElement("option");p.value=e.id;p.textContent=e.name;s.appendChild(p)})}
function drawR(){var f=$("fe").value,tb=$("rb");tb.innerHTML="";RG.filter(function(g){return !f||g.event_id==f}).forEach(function(g){var tr=document.createElement("tr"),ev=EV.filter(function(e){return e.id===g.event_id})[0];
 cell(tr,ev?ev.name:g.event_id);cell(tr,g.name);cell(tr,g.email);cell(tr,g.phone);cell(tr,g.college);cell(tr,g.team_members);cell(tr,g.payment_ref);cell(tr,new Date(g.created_at).toLocaleString("en-IN"));
 var td=cell(tr,"");btn(td,"Delete",async function(){if(confirm("Delete this registration?")){await api("/rest/v1/registrations?id=eq."+g.id,{method:"DELETE"});load()}});tb.appendChild(tr)})}
$("fe").onchange=drawR;
function edit(e){eid=e.id;if(e.track&&![].slice.call($("track").options).some(function(o){return o.value===e.track})){var op=document.createElement("option");op.textContent=e.track;$("track").appendChild(op)}
 F.forEach(function(k){$(k).value=e[k]==null?"":e[k]});["start_time","end_time"].forEach(function(k){$(k).value=(e[k]||"").slice(0,5)});
 $("reg_open").checked=e.reg_open;$("is_published").checked=e.is_published;$("ft").textContent="Edit event #"+e.id;scrollTo(0,0)}
function clr(){eid=null;F.forEach(function(k){$(k).value=""});$("team_size").value="1-4";$("fee").value=0;$("ft").textContent="Add event"}
$("cl").onclick=clr;
$("sv").onclick=async function(){var o={};F.forEach(function(k){o[k]=$(k).value||null});o.track=o.track||"General";o.fee=+$("fee").value||0;o.reg_open=$("reg_open").checked;o.is_published=$("is_published").checked;
 if(!o.name){say("Event name is required.");return}
 say("Saving…");
 var r=await api(eid?"/rest/v1/events?id=eq."+eid:"/rest/v1/events",{method:eid?"PATCH":"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(o)});
 if(r.ok){say("Saved.");clr();load();return}
 var msg="";try{var j=await r.json();msg=j.message||j.hint||""}catch(x){}
 if(r.status===401){say("Session expired. Please log in again.");sessionStorage.removeItem("tok");setTimeout(function(){location.reload()},1500);return}
 if(r.status===403||/row-level security/i.test(msg)){msg="Permission denied: this account is not allowed to edit events. Run the repair SQL and make sure your email is in the admins table."}
 say("Save failed ("+r.status+"): "+msg)};
async function del(e){if(!confirm("Delete "+e.name+" and ALL its registrations? This cannot be undone."))return;var r=await api("/rest/v1/events?id=eq."+e.id,{method:"DELETE"});say(r.ok?"Deleted.":"Delete failed ("+r.status+").");load()}
function tab(n){$("p1").classList.toggle("hide",n!==1);$("p2").classList.toggle("hide",n!==2);$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":""}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
$("ex").onclick=function(){var f=$("fe").value,q=function(v){v=v==null?"":String(v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
 var rows=[["Event","Name","Email","Phone","College","Team","UTR/Ref","Registered at"]].concat(RG.filter(function(g){return !f||g.event_id==f}).map(function(g){var ev=EV.filter(function(e){return e.id===g.event_id})[0];return[ev?ev.name:g.event_id,g.name,g.email,g.phone,g.college,g.team_members,g.payment_ref,g.created_at]}));
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(function(r){return r.map(q).join(",")}).join("\n")],{type:"text/csv"}));a.download="plasma-registrations.csv";a.click()};
if(tok)start();
</script></body></html>
